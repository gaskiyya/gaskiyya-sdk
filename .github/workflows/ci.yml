name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  package:
    name: Build and check the package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:package

  live:
    name: Contract test against the Gaskiyya sandbox
    needs: test
    if: github.event_name == 'push' && vars.GASKIYYA_API_URL != ''
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          GASKIYYA_API_URL: ${{ vars.GASKIYYA_API_URL }}
          GASKIYYA_CLIENT_ID: ${{ vars.GASKIYYA_CLIENT_ID }}
          GASKIYYA_CLIENT_SECRET: ${{ secrets.GASKIYYA_CLIENT_SECRET }}
